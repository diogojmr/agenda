<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174d96">
  <title>Agenda Comercial</title>
  <style>
    :root {
      --ink: #17233b;
      --muted: #667085;
      --line: #dce4ef;
      --page: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #eef3fa;
      --blue: #174d96;
      --blue-dark: #10386f;
      --blue-soft: #3d6fab;
      --red: #d61f2c;
      --red-dark: #a91520;
      --shadow: 0 20px 60px rgba(23, 77, 150, .16);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #f4f7fb;
      --muted: #aab6c8;
      --line: #34445d;
      --page: #0d1522;
      --surface: #162136;
      --surface-2: #22314a;
      --blue: #4f86d8;
      --blue-dark: #0a2549;
      --blue-soft: #72a0e2;
      --red: #f04452;
      --red-dark: #d12b38;
      --shadow: 0 20px 60px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }
    html { background: var(--page); }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font-family: Aptos, "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(23, 77, 150, .25);
      outline-offset: 2px;
    }
    h1, h2, h3, p { margin: 0; }

    .app-shell {
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 28px;
      height: 100vh;
      padding: 24px;
      background: var(--blue);
      color: #f7fbf8;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      border-bottom: 4px solid var(--red);
      background: #ffffff;
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }
    .brand strong, .brand span { display: block; }
    .brand strong { font-size: 16px; }
    .brand-copy span { margin-top: 2px; color: #d8e4f4; font-size: 13px; }
    .nav-list { display: grid; gap: 8px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #eef4fc;
      text-align: left;
    }
    .nav-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      padding: 0 4px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      color: #d8e4f4;
      font-size: 11px;
      font-weight: 900;
    }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,.09); color: #fff; }
    .nav-item.active .nav-mark { border-color: #ffffff; background: #ffffff; color: var(--red); }

    .primary, .secondary, .ghost, .icon-button, .done-button, .theme-toggle {
      border: 0;
      border-radius: 8px;
      font-weight: 800;
    }
    .primary, .secondary, .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 16px;
      white-space: nowrap;
    }
    .primary { background: var(--red); color: #fff; }
    .primary:hover { background: var(--red-dark); }
    .sidebar > .primary { margin-top: 0; }
    .secondary { background: var(--surface-2); color: var(--blue); }
    .secondary:hover { background: #dfe8f5; }
    .ghost { background: transparent; color: var(--muted); }
    .compact { display: none; }
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      margin-top: auto;
      padding: 10px 12px;
      background: rgba(255,255,255,.1);
      color: #ffffff;
      text-align: left;
    }
    .theme-toggle:hover { background: rgba(255,255,255,.17); }
    .theme-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 6px;
      font-size: 16px;
    }

    .workspace { display: flex; min-width: 0; flex-direction: column; gap: 18px; padding: 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .eyebrow {
      margin-bottom: 5px;
      color: var(--red);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 { font-size: clamp(32px, 4vw, 50px); line-height: 1; }
    h2 { font-size: 19px; }
    h3 { font-size: 15px; }

    .filterbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(140px, 180px));
      align-items: end;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .field { display: grid; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 800; }
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: #fbfcfa;
      color: var(--ink);
    }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,77,150,.14); }

    .view-stack { display: grid; gap: 18px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric {
      padding: 18px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      background: var(--surface);
    }
    .metric.danger { border-left-color: var(--red); }
    .metric.warning { border-left-color: var(--red); }
    .metric.calm { border-left-color: var(--blue-soft); }
    .metric span { display: block; color: var(--muted); font-size: 13px; font-weight: 750; }
    .metric strong { display: block; margin-top: 10px; font-size: 36px; line-height: 1; }

    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }
    .activity-list { display: grid; }
    .activity-card {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 44px;
      gap: 16px;
      align-items: stretch;
      padding: 16px 18px;
      border-left: 5px solid var(--line);
      background: #fff;
    }
    .activity-card + .activity-card { border-top: 1px solid var(--line); }
    .activity-card.priority-alta { border-left-color: var(--red); }
    .activity-card.priority-media { border-left-color: var(--blue); }
    .activity-card.priority-baixa { border-left-color: #8ca0ba; }
    .activity-card.overdue { background: #fff5f6; }
    .activity-card.status-concluido { opacity: .65; }
    .time-block { display: grid; align-content: start; justify-items: start; gap: 4px; }
    .time-block strong { font-size: 18px; }
    .time-block span { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: capitalize; }
    .activity-main { display: grid; min-width: 0; gap: 9px; }
    .activity-title { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .activity-title div { min-width: 0; }
    .activity-title h3, .activity-title p { overflow-wrap: anywhere; }
    .activity-title p, .activity-notes, .empty-state, .empty-small { color: var(--muted); }
    .activity-title p { margin-top: 3px; font-size: 13px; }
    .activity-notes { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
    .type-badge {
      display: inline-flex;
      flex: 0 0 28px;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }
    .type-chamada { background: var(--blue); }
    .type-reuniao { background: var(--blue); }
    .type-email { background: var(--blue-soft); }
    .type-visita { background: #35639f; }
    .type-proposta { background: var(--red); }
    .type-follow-up { background: #b71c28; }
    .type-tarefa { background: #6f8199; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 900; }
    .chip.priority-alta, .overdue-chip { background: #fde8e4; color: var(--red); }
    .chip.priority-media { background: #eaf1fb; color: var(--blue); }
    .chip.priority-baixa { background: #edf1f5; color: #60728a; }
    .chip.status-concluido { background: #e8eff8; color: var(--blue-dark); }
    .chip.status-por_fazer { background: #edf2f7; color: #405060; }
    .chip.status-em_curso { background: #e6effb; color: var(--blue); }
    .done-button {
      align-self: center;
      justify-self: end;
      width: 44px;
      height: 44px;
      background: var(--surface-2);
      color: var(--blue);
      font-size: 20px;
    }
    .done-button:hover { background: var(--blue); color: #fff; }
    .empty-state { padding: 22px; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .day-column { min-height: 340px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .day-column header { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--line); }
    .day-column header span { color: var(--muted); font-size: 12px; font-weight: 900; text-transform: capitalize; }
    .day-list { display: grid; gap: 8px; padding: 10px; }
    .mini-activity { display: grid; gap: 4px; padding: 10px; border-left: 4px solid var(--line); border-radius: 8px; background: #fbfcfa; }
    .mini-activity.priority-alta { border-left-color: var(--red); }
    .mini-activity.priority-media { border-left-color: var(--blue); }
    .mini-activity.priority-baixa { border-left-color: #8ca0ba; }
    .mini-activity span { color: var(--blue); font-size: 12px; font-weight: 900; }
    .mini-activity p { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .empty-small { padding: 6px 2px; font-size: 13px; }

    .clients-layout { display: grid; grid-template-columns: minmax(260px, 350px) minmax(0, 1fr); gap: 18px; }
    .client-buttons { display: grid; gap: 8px; padding: 12px; }
    .client-button { display: grid; gap: 3px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfa; color: var(--ink); text-align: left; }
    .client-button:hover, .client-button.active { border-color: rgba(23,77,150,.42); background: var(--surface-2); }
    .client-button span { color: var(--muted); font-size: 13px; }
    .client-form { display: grid; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
    .client-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 18px; border-bottom: 1px solid var(--line); }
    .client-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0; padding: 18px; }
    .client-fields div { padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfa; }
    .client-fields dt { margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 900; }
    .client-fields dd { margin: 0; overflow-wrap: anywhere; }
    .client-history { border-top: 1px solid var(--line); }

    dialog {
      width: min(720px, calc(100% - 28px));
      max-height: calc(100vh - 28px);
      padding: 0;
      border: 0;
      border-radius: 8px;
      box-shadow: var(--shadow);
      background: var(--surface);
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(15,24,22,.58); }
    .composer { display: grid; gap: 14px; padding: 20px; }
    .composer-header, .composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .icon-button { width: 42px; height: 42px; background: var(--surface-2); color: var(--ink); font-size: 24px; line-height: 1; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      max-width: min(360px, calc(100vw - 44px));
      padding: 13px 16px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--red);
      background: var(--blue-dark);
      color: #fff;
      font-size: 14px;
      font-weight: 750;
    }
    .hidden { display: none !important; }

    html[data-theme="dark"] .sidebar { background: #0d376b; }
    html[data-theme="dark"] input,
    html[data-theme="dark"] select,
    html[data-theme="dark"] textarea,
    html[data-theme="dark"] .activity-card,
    html[data-theme="dark"] .mini-activity,
    html[data-theme="dark"] .client-button,
    html[data-theme="dark"] .client-fields div { background: #111c2e; }
    html[data-theme="dark"] .activity-card.overdue { background: #2d1b27; }
    html[data-theme="dark"] .chip.priority-alta,
    html[data-theme="dark"] .overdue-chip { background: #48232c; }
    html[data-theme="dark"] .chip.priority-media,
    html[data-theme="dark"] .chip.status-em_curso { background: #1d3557; }
    html[data-theme="dark"] .chip.priority-baixa,
    html[data-theme="dark"] .chip.status-por_fazer { background: #29364a; color: #c0cad8; }
    html[data-theme="dark"] .chip.status-concluido { background: #213b5f; color: #b8d4fa; }
    html[data-theme="dark"] .client-button:hover,
    html[data-theme="dark"] .client-button.active { background: #223553; }

    @media (max-width: 1040px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; display: grid; grid-template-columns: 1fr; gap: 14px; height: auto; padding: 14px; }
      .nav-list { display: grid; grid-template-columns: repeat(5, minmax(112px, 1fr)); overflow-x: auto; padding-bottom: 2px; }
      .sidebar > .primary { display: none; }
      .theme-toggle { margin-top: 0; }
      .compact { display: inline-flex; }
      .workspace { padding: 18px; }
      .filterbar, .metrics, .clients-layout { grid-template-columns: 1fr; }
      .calendar-grid { grid-template-columns: repeat(7, minmax(220px, 1fr)); }
    }
    @media (max-width: 680px) {
      .brand-copy span { display: none; }
      .topbar { align-items: flex-start; }
      h1 { font-size: 36px; }
      .activity-card { grid-template-columns: 1fr 42px; }
      .time-block { display: flex; grid-column: 1 / -1; align-items: baseline; gap: 10px; }
      .client-fields, .form-grid { grid-template-columns: 1fr; }
      .composer { padding: 16px; }
      .composer-footer { align-items: stretch; flex-direction: column-reverse; }
      .composer-footer button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <span class="brand-mark">AC</span>
        <div class="brand-copy"><strong>Agenda Comercial</strong><span>Mini CRM pessoal</span></div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="hoje"><span class="nav-mark">H</span>Hoje</button>
        <button class="nav-item" data-view="calendario"><span class="nav-mark">C</span>Calendário</button>
        <button class="nav-item" data-view="followups"><span class="nav-mark">F</span>Follow-ups</button>
        <button class="nav-item" data-view="pendentes"><span class="nav-mark">P</span>Pendentes</button>
        <button class="nav-item" data-view="clientes"><span class="nav-mark">CL</span>Clientes</button>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
        <span class="theme-icon" id="theme-icon" aria-hidden="true">◐</span>
        <span id="theme-label">Modo escuro</span>
      </button>
      <button class="primary" data-open-activity><span aria-hidden="true">+</span> Nova atividade</button>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div><p class="eyebrow" id="today-label"></p><h1 id="view-title">Hoje</h1></div>
        <button class="primary compact" data-open-activity><span aria-hidden="true">+</span> Nova</button>
      </header>

      <section class="filterbar" aria-label="Pesquisa e filtros">
        <label class="field">Pesquisa<input id="filter-query" placeholder="Cliente, ação ou nota" autocomplete="off"></label>
        <label class="field">Tipo
          <select id="filter-type">
            <option value="todos">Todos</option><option value="chamada">Chamada</option><option value="reuniao">Reunião</option><option value="email">Email</option><option value="visita">Visita</option><option value="proposta">Proposta</option><option value="follow-up">Follow-up</option><option value="tarefa">Tarefa</option>
          </select>
        </label>
        <label class="field">Estado
          <select id="filter-status"><option value="todos">Todos</option><option value="por_fazer">Por fazer</option><option value="em_curso">Em curso</option><option value="concluido">Concluído</option></select>
        </label>
        <label class="field">Prioridade
          <select id="filter-priority"><option value="todos">Todas</option><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select>
        </label>
      </section>

      <div id="view-root" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="activity-dialog">
    <form class="composer" id="activity-form">
      <header class="composer-header">
        <div><p class="eyebrow">Registo rápido</p><h2>Nova atividade</h2></div>
        <button class="icon-button" type="button" data-close-dialog aria-label="Fechar">×</button>
      </header>
      <label class="field">Cliente<input id="activity-client" list="client-options" placeholder="Empresa ou cliente" required autocomplete="off"></label>
      <datalist id="client-options"></datalist>
      <label class="field">Ação<input id="activity-title" placeholder="Ex.: ligar para validar proposta" required></label>
      <div class="form-grid">
        <label class="field">Tipo<select id="activity-type"><option value="chamada">Chamada</option><option value="reuniao">Reunião</option><option value="email">Email</option><option value="visita">Visita</option><option value="proposta">Proposta</option><option value="follow-up">Follow-up</option><option value="tarefa">Tarefa</option></select></label>
        <label class="field">Data<input id="activity-date" type="date" required></label>
        <label class="field">Hora<input id="activity-time" type="time" required value="09:30"></label>
        <label class="field">Prioridade<select id="activity-priority"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select></label>
        <label class="field">Estado<select id="activity-status"><option value="por_fazer">Por fazer</option><option value="em_curso">Em curso</option><option value="concluido">Concluído</option></select></label>
      </div>
      <label class="field">Notas<textarea id="activity-notes" placeholder="Próximo passo, contexto ou detalhe importante"></textarea></label>
      <footer class="composer-footer"><button class="ghost" type="button" data-close-dialog>Cancelar</button><button class="primary" type="submit">Guardar atividade</button></footer>
    </form>
  </dialog>

  <div class="toast hidden" id="toast" role="status"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "agenda-comercial-site-v1";
      const THEME_KEY = "agenda-comercial-theme";
      const typeLabels = { chamada: "Chamada", reuniao: "Reunião", email: "Email", visita: "Visita", proposta: "Proposta", "follow-up": "Follow-up", tarefa: "Tarefa" };
      const typeMarks = { chamada: "C", reuniao: "R", email: "E", visita: "V", proposta: "P", "follow-up": "F", tarefa: "T" };
      const priorityLabels = { alta: "Alta", media: "Média", baixa: "Baixa" };
      const statusLabels = { por_fazer: "Por fazer", em_curso: "Em curso", concluido: "Concluído" };
      const viewTitles = { hoje: "Hoje", calendario: "Calendário", followups: "Follow-ups", pendentes: "Pendentes", clientes: "Clientes" };

      const state = {
        activeView: "hoje",
        selectedClientId: "cli-abc",
        filters: { query: "", type: "todos", status: "todos", priority: "todos" },
        clients: [],
        activities: []
      };
      let storageAvailable = true;

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const todayISO = () => localISO(new Date());
      const localISO = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const relativeDate = days => { const date = new Date(); date.setDate(date.getDate() + days); return localISO(date); };
      const makeId = prefix => `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const escapeHTML = value => String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const formatDate = value => new Intl.DateTimeFormat("pt-PT", { weekday: "short", day: "2-digit", month: "short" }).format(new Date(`${value}T12:00:00`));
      const formatLongDate = value => new Intl.DateTimeFormat("pt-PT", { weekday: "long", day: "2-digit", month: "long" }).format(new Date(`${value}T12:00:00`));
      const activityDate = activity => new Date(`${activity.date}T${activity.time || "23:59"}:00`);
      const isOverdue = activity => activity.status !== "concluido" && activityDate(activity) < new Date();
      const sortActivities = (a, b) => activityDate(a) - activityDate(b) || ({ alta: 0, media: 1, baixa: 2 }[a.priority] - { alta: 0, media: 1, baixa: 2 }[b.priority]);

      function seedData() {
        return {
          clients: [
            { id: "cli-abc", name: "Empresa ABC", contact: "Marta Silva", phone: "912 345 678", email: "marta.silva@empresaabc.pt", notes: "Interessados em proposta anual. Preferem contacto de manhã." },
            { id: "cli-xpto", name: "Cliente XPTO", contact: "João Ferreira", phone: "934 222 100", email: "joao@xpto.pt", notes: "Decisor financeiro envolvido na próxima reunião." },
            { id: "cli-norte", name: "Grupo Norte", contact: "Ana Ribeiro", phone: "919 450 111", email: "ana.ribeiro@gruponorte.pt", notes: "Tem três unidades. Validar disponibilidade para visita." }
          ],
          activities: [
            { id: "act-1", clientId: "cli-abc", clientName: "Empresa ABC", title: "Ligar ao responsável de RH", type: "chamada", date: relativeDate(0), time: "09:30", priority: "alta", status: "por_fazer", notes: "Confirmar necessidades e marcar apresentação." },
            { id: "act-2", clientId: "cli-xpto", clientName: "Cliente XPTO", title: "Reunião de apresentação", type: "reuniao", date: relativeDate(0), time: "11:00", priority: "alta", status: "em_curso", notes: "Levar resumo da proposta e próximos passos." },
            { id: "act-3", clientId: "cli-norte", clientName: "Grupo Norte", title: "Enviar proposta revista", type: "proposta", date: relativeDate(0), time: "15:00", priority: "media", status: "por_fazer", notes: "Ajustar valores para três unidades." },
            { id: "act-4", clientId: "cli-xpto", clientName: "Cliente XPTO", title: "Follow-up da proposta enviada", type: "follow-up", date: relativeDate(1), time: "10:00", priority: "media", status: "por_fazer", notes: "Perguntar se já tiveram feedback interno." },
            { id: "act-5", clientId: "cli-abc", clientName: "Empresa ABC", title: "Resposta sobre documentação", type: "tarefa", date: relativeDate(-1), time: "17:00", priority: "alta", status: "por_fazer", notes: "Ficou pendente desde ontem." },
            { id: "act-6", clientId: "cli-norte", clientName: "Grupo Norte", title: "Visita comercial", type: "visita", date: relativeDate(3), time: "14:30", priority: "media", status: "por_fazer", notes: "Confirmar morada final antes de sair." }
          ]
        };
      }

      function load() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (stored && Array.isArray(stored.clients) && Array.isArray(stored.activities)) {
            state.clients = stored.clients;
            state.activities = stored.activities;
            state.selectedClientId = stored.clients[0]?.id || "";
            return;
          }
        } catch (_) {}
        Object.assign(state, seedData());
        save();
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ clients: state.clients, activities: state.activities }));
        } catch (_) {
          storageAvailable = false;
        }
      }

      function applyTheme(theme) {
        const isDark = theme === "dark";
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        $("#theme-toggle").setAttribute("aria-pressed", String(isDark));
        $("#theme-label").textContent = isDark ? "Modo claro" : "Modo escuro";
        $("#theme-icon").textContent = isDark ? "○" : "◐";
        $("meta[name='theme-color']").setAttribute("content", isDark ? "#0d376b" : "#174d96");
      }

      function loadTheme() {
        try {
          applyTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");
        } catch (_) {
          applyTheme("light");
        }
      }

      function toggleTheme() {
        const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
        try { localStorage.setItem(THEME_KEY, nextTheme); } catch (_) {}
      }

      function filteredActivities() {
        const query = state.filters.query.trim().toLocaleLowerCase("pt-PT");
        return state.activities.filter(activity => {
          const haystack = `${activity.clientName} ${activity.title} ${activity.notes}`.toLocaleLowerCase("pt-PT");
          return (!query || haystack.includes(query))
            && (state.filters.type === "todos" || activity.type === state.filters.type)
            && (state.filters.status === "todos" || activity.status === state.filters.status)
            && (state.filters.priority === "todos" || activity.priority === state.filters.priority);
        }).sort(sortActivities);
      }

      function panel(title, activities, emptyText) {
        return `<section class="panel"><header class="panel-header"><h2>${escapeHTML(title)}</h2><span class="count">${activities.length}</span></header><div class="activity-list">${activities.length ? activities.map(activityCard).join("") : `<p class="empty-state">${escapeHTML(emptyText)}</p>`}</div></section>`;
      }

      function activityCard(activity) {
        const overdue = isOverdue(activity);
        const done = activity.status === "concluido";
        return `<article class="activity-card priority-${activity.priority} status-${activity.status}${overdue ? " overdue" : ""}">
          <div class="time-block"><strong>${escapeHTML(activity.time)}</strong><span>${escapeHTML(formatDate(activity.date))}</span></div>
          <div class="activity-main">
            <div class="activity-title"><span class="type-badge type-${activity.type}">${typeMarks[activity.type]}</span><div><h3>${escapeHTML(activity.title)}</h3><p>${escapeHTML(activity.clientName)} · ${typeLabels[activity.type]}</p></div></div>
            ${activity.notes ? `<p class="activity-notes">${escapeHTML(activity.notes)}</p>` : ""}
            <div class="chips"><span class="chip priority-${activity.priority}">${priorityLabels[activity.priority]}</span><span class="chip status-${activity.status}">${statusLabels[activity.status]}</span>${overdue ? `<span class="chip overdue-chip">Atrasada</span>` : ""}</div>
          </div>
          ${done ? "" : `<button class="done-button" data-done="${activity.id}" aria-label="Marcar como concluída" title="Marcar como concluída">✓</button>`}
        </article>`;
      }

      function renderToday(activities) {
        const today = activities.filter(item => item.date === todayISO());
        const overdue = activities.filter(isOverdue);
        const open = state.activities.filter(item => item.status !== "concluido");
        return `<div class="view-stack">
          <section class="metrics" aria-label="Resumo do dia">
            <article class="metric"><span>Atividades hoje</span><strong>${today.length}</strong></article>
            <article class="metric danger"><span>Atrasadas</span><strong>${overdue.length}</strong></article>
            <article class="metric warning"><span>Prioridade alta</span><strong>${open.filter(item => item.priority === "alta").length}</strong></article>
            <article class="metric calm"><span>Follow-ups abertos</span><strong>${open.filter(item => item.type === "follow-up").length}</strong></article>
          </section>
          ${overdue.length ? panel("Atrasadas", overdue, "") : ""}
          ${panel("Agenda de hoje", today, "Hoje está livre com estes filtros.")}
        </div>`;
      }

      function renderCalendar(activities) {
        const days = Array.from({ length: 7 }, (_, index) => relativeDate(index));
        return `<section class="calendar-grid" aria-label="Calendário semanal">${days.map(day => {
          const dayActivities = activities.filter(item => item.date === day);
          return `<article class="day-column"><header><span>${escapeHTML(formatDate(day))}</span><strong>${dayActivities.length}</strong></header><div class="day-list">${dayActivities.length ? dayActivities.map(item => `<div class="mini-activity priority-${item.priority}"><span>${escapeHTML(item.time)} · ${typeLabels[item.type]}</span><strong>${escapeHTML(item.title)}</strong><p>${escapeHTML(item.clientName)}</p>${item.status === "concluido" ? "" : `<button class="ghost" data-done="${item.id}" type="button">✓ Concluir</button>`}</div>`).join("") : `<p class="empty-small">Sem atividades</p>`}</div></article>`;
        }).join("")}</section>`;
      }

      function renderClients() {
        const query = state.filters.query.trim().toLocaleLowerCase("pt-PT");
        const visibleClients = state.clients.filter(client => !query || `${client.name} ${client.contact} ${client.phone} ${client.email} ${client.notes}`.toLocaleLowerCase("pt-PT").includes(query));
        const selected = visibleClients.find(client => client.id === state.selectedClientId) || visibleClients[0];
        if (selected) state.selectedClientId = selected.id;
        const history = selected ? state.activities.filter(item => item.clientId === selected.id).sort(sortActivities) : [];
        return `<section class="clients-layout">
          <div class="panel">
            <header class="panel-header"><h2>Clientes</h2><span class="count">${visibleClients.length}</span></header>
            <div class="client-buttons">${visibleClients.length ? visibleClients.map(client => `<button class="client-button${client.id === state.selectedClientId ? " active" : ""}" data-client="${client.id}"><strong>${escapeHTML(client.name)}</strong><span>${escapeHTML(client.contact || "Sem contacto")}</span></button>`).join("") : `<p class="empty-small">Nenhum cliente encontrado.</p>`}</div>
            <form class="client-form" id="client-form">
              <h3>Novo cliente</h3>
              <input name="name" placeholder="Empresa ou cliente" required>
              <input name="contact" placeholder="Pessoa de contacto">
              <input name="phone" placeholder="Telefone">
              <input name="email" type="email" placeholder="Email">
              <textarea name="notes" placeholder="Notas rápidas"></textarea>
              <button class="secondary" type="submit">Adicionar cliente</button>
            </form>
          </div>
          <div class="panel">
            ${selected ? `<header class="client-heading"><div><p class="eyebrow">Ficha de cliente</p><h2>${escapeHTML(selected.name)}</h2></div><button class="secondary" data-open-activity data-client-name="${escapeHTML(selected.name)}">+ Atividade</button></header>
            <dl class="client-fields"><div><dt>Contacto</dt><dd>${escapeHTML(selected.contact || "Não indicado")}</dd></div><div><dt>Telefone</dt><dd>${escapeHTML(selected.phone || "Não indicado")}</dd></div><div><dt>Email</dt><dd>${escapeHTML(selected.email || "Não indicado")}</dd></div><div><dt>Notas</dt><dd>${escapeHTML(selected.notes || "Sem notas")}</dd></div></dl>
            <section class="client-history"><header class="panel-header"><h2>Histórico e próximas ações</h2><span class="count">${history.length}</span></header><div class="activity-list">${history.length ? history.map(activityCard).join("") : `<p class="empty-state">Este cliente ainda não tem histórico.</p>`}</div></section>` : `<p class="empty-state">Crie o primeiro cliente.</p>`}
          </div>
        </section>`;
      }

      function render() {
        const activities = filteredActivities();
        $("#today-label").textContent = formatLongDate(todayISO());
        $("#view-title").textContent = viewTitles[state.activeView];
        $$(".nav-item").forEach(button => button.classList.toggle("active", button.dataset.view === state.activeView));
        let html = "";
        if (state.activeView === "hoje") html = renderToday(activities);
        if (state.activeView === "calendario") html = renderCalendar(activities);
        if (state.activeView === "followups") html = panel("Follow-ups por data", activities.filter(item => item.type === "follow-up"), "Sem follow-ups com estes filtros.");
        if (state.activeView === "pendentes") html = panel("Pendentes e atrasados", activities.filter(item => item.status !== "concluido" && (item.type === "proposta" || item.type === "tarefa" || isOverdue(item))), "Sem pendentes ativos.");
        if (state.activeView === "clientes") html = renderClients();
        $("#view-root").innerHTML = html;
      }

      function updateDatalist() {
        $("#client-options").innerHTML = state.clients.map(client => `<option value="${escapeHTML(client.name)}"></option>`).join("");
      }

      function openActivity(clientName = "") {
        updateDatalist();
        $("#activity-form").reset();
        $("#activity-date").value = todayISO();
        $("#activity-time").value = "09:30";
        $("#activity-priority").value = "media";
        $("#activity-client").value = clientName;
        $("#activity-dialog").showModal();
        setTimeout(() => (clientName ? $("#activity-title") : $("#activity-client")).focus(), 0);
      }

      function toast(message) {
        const element = $("#toast");
        element.textContent = message;
        element.classList.remove("hidden");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => element.classList.add("hidden"), 2400);
      }

      document.addEventListener("click", event => {
        if (event.target.closest("#theme-toggle")) { toggleTheme(); return; }
        const nav = event.target.closest("[data-view]");
        if (nav) { state.activeView = nav.dataset.view; render(); return; }
        const open = event.target.closest("[data-open-activity]");
        if (open) { openActivity(open.dataset.clientName || ""); return; }
        if (event.target.closest("[data-close-dialog]")) { $("#activity-dialog").close(); return; }
        const done = event.target.closest("[data-done]");
        if (done) {
          const activity = state.activities.find(item => item.id === done.dataset.done);
          if (activity) { activity.status = "concluido"; save(); render(); toast("Atividade concluída"); }
          return;
        }
        const client = event.target.closest("[data-client]");
        if (client) { state.selectedClientId = client.dataset.client; render(); }
      });

      ["query", "type", "status", "priority"].forEach(key => {
        const input = $(`#filter-${key}`);
        input.addEventListener(key === "query" ? "input" : "change", () => { state.filters[key] = input.value; render(); });
      });

      $("#activity-form").addEventListener("submit", event => {
        event.preventDefault();
        const clientName = $("#activity-client").value.trim();
        const title = $("#activity-title").value.trim();
        if (!clientName || !title) return;
        let client = state.clients.find(item => item.name.toLocaleLowerCase("pt-PT") === clientName.toLocaleLowerCase("pt-PT"));
        if (!client) {
          client = { id: makeId("cli"), name: clientName, contact: "", phone: "", email: "", notes: "Criado automaticamente a partir de uma atividade." };
          state.clients.push(client);
        }
        state.activities.push({ id: makeId("act"), clientId: client.id, clientName: client.name, title, type: $("#activity-type").value, date: $("#activity-date").value, time: $("#activity-time").value, priority: $("#activity-priority").value, status: $("#activity-status").value, notes: $("#activity-notes").value.trim() });
        state.selectedClientId = client.id;
        save();
        $("#activity-dialog").close();
        render();
        toast("Atividade guardada");
      });

      $("#view-root").addEventListener("submit", event => {
        if (event.target.id !== "client-form") return;
        event.preventDefault();
        const data = new FormData(event.target);
        const name = String(data.get("name") || "").trim();
        if (!name) return;
        const client = { id: makeId("cli"), name, contact: String(data.get("contact") || "").trim(), phone: String(data.get("phone") || "").trim(), email: String(data.get("email") || "").trim(), notes: String(data.get("notes") || "").trim() };
        state.clients.push(client);
        state.selectedClientId = client.id;
        save();
        render();
        toast("Cliente adicionado");
      });

      $("#activity-dialog").addEventListener("click", event => {
        if (event.target === $("#activity-dialog")) $("#activity-dialog").close();
      });

      loadTheme();
      load();
      $("#activity-date").value = todayISO();
      render();
      if (!storageAvailable) toast("O navegador não permitiu guardar os dados. Experimente outro navegador.");
    })();
  </script>
</body>
</html>
